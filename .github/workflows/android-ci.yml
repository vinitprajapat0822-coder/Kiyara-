name: KIARAA Android CI

on:
  # Main pushes and pull requests run CI. PR branches are not built twice on each push.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiaraa-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile, test, and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 36.1 and Build Tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Generate CI-only debug signing keystore
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify Wrapper and Gradle version
        run: ./gradlew --no-daemon --version

      - name: Configure API secrets for Gradle (never print secret values)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : > .env
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then printf 'GEMINI_API_KEY=%s\\n' "$GEMINI_API_KEY" >> .env; fi
          if [[ -n "${ELEVENLABS_API_KEY:-}" ]]; then printf 'ELEVENLABS_API_KEY=%s\\n' "$ELEVENLABS_API_KEY" >> .env; fi
          if [[ -n "${ELEVENLABS_VOICE_ID:-}" ]]; then printf 'ELEVENLABS_VOICE_ID=%s\\n' "$ELEVENLABS_VOICE_ID" >> .env; fi
          if [[ ! -s .env ]]; then rm -f .env; echo "No API repository secrets configured; Gradle will use .env.example placeholders."; else echo "API secret file configured (values hidden)."; fi

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kiaraa-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: kiaraa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
